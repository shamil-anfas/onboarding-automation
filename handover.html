<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deal Won Handover — BrightPath Digital</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #fff;
        --ink: #1a2333;
        --muted: #64748b;
        --brand: #4f46e5;
        --brand-dark: #4338ca;
        --ok: #16a34a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header {
        text-align: center;
        margin-bottom: 20px;
      }
      header .logo {
        font-size: 28px;
      }
      header h1 {
        font-size: 1.5rem;
        margin: 8px 0 4px;
      }
      header p {
        color: var(--muted);
        margin: 0;
      }
      form {
        background: var(--card);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
        display: grid;
        gap: 14px;
      }
      label {
        font-size: 0.85rem;
        font-weight: 600;
        display: grid;
        gap: 6px;
      }
      input,
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
      }
      input:focus,
      textarea:focus {
        outline: 2px solid var(--brand);
        border-color: var(--brand);
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      .row {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 520px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
      button {
        background: var(--brand);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 13px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-dark);
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #success {
        display: none;
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
        padding: 14px;
        border-radius: 10px;
        margin-top: 16px;
        text-align: center;
        font-weight: 600;
      }
      #success.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">✨</div>
        <h1>Deal Won Handover</h1>
        <p>sales to delivery handoff</p>
      </header>

      <form id="handoverForm" novalidate>
        <label
          >Client Name
          <input
            type="text"
            name="client_name"
            required
            autocomplete="organization"
          />
        </label>
        <div class="row">
          <label
            >Contact Name
            <input
              type="text"
              name="contact_name"
              required
              autocomplete="name"
            />
          </label>
          <label
            >Contact Email
            <input
              type="email"
              name="contact_email"
              required
              autocomplete="email"
            />
          </label>
        </div>
        <div class="row">
          <label
            >Deal Value
            <input
              type="number"
              name="deal_value"
              min="0"
              step="0.01"
              required
            />
          </label>
          <label
            >Sales Rep
            <input type="text" name="sales_rep" required />
          </label>
        </div>
        <label
          >Project Manager Name
          <input type="text" name="pm_name" required />
        </label>
        <label
          >Deal Summary
          <textarea
            name="deal_summary"
            required
            placeholder="Scope, timeline, key promises…"
          ></textarea>
        </label>
        <button type="submit" id="submitBtn">Submit Handover</button>
      </form>

      <div id="success" role="status">✅ Handover submitted</div>
    </div>

    <script>
      // Set from MAKE_WEBHOOK_URL in .env (not committed with secrets).
      const WEBHOOK_URL =
        "YOUR_WEBHOOK_URL_HERE";

      const form = document.getElementById("handoverForm");
      const success = document.getElementById("success");
      const btn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }
        btn.disabled = true;
        try {
          const body = new URLSearchParams(new FormData(form)).toString();
          await fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body,
          });
          success.classList.add("show");
          form.reset();
        } catch (err) {
          // no-cors responses are opaque; only network errors land here
          alert("⚠️ Submission failed. Please try again.");
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
